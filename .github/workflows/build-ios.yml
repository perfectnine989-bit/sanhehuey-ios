name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SINGBOX_TAG: v1.12.25

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Libbox
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: Frameworks/Libbox.xcframework
          key: libbox-${{ env.SINGBOX_TAG }}-ios-v1

      - name: Build Libbox (sing-box core)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SINGBOX_TAG" https://github.com/SagerNet/sing-box sing-box-src
          cd sing-box-src
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          go run ./cmd/internal/build_libbox -target apple -platform ios
          mkdir -p ../Frameworks
          rm -rf ../Frameworks/Libbox.xcframework
          mv Libbox.xcframework ../Frameworks/

      - name: Inject key from secret
        env:
          HY2_LINK: ${{ secrets.HY2_LINK }}
          VLESS_LINK: ${{ secrets.VLESS_LINK }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse as u
          link = os.environ.get('HY2_LINK', '').strip()
          if not link:
              sys.exit('Secret HY2_LINK is empty')
          p = u.urlparse(link)
          q = u.parse_qs(p.query)
          code = (
              'enum Credentials {\n'
              '    static let server = "%s"\n'
              '    static let port = %d\n'
              '    static let password = "%s"\n'
              '    static let sni = "%s"\n'
              '    static let obfsPassword = "%s"\n'
              '}\n'
          ) % (p.hostname, p.port or 443, u.unquote(p.username or ''), q.get('peer', [p.hostname])[0], q.get('obfs-password', [''])[0])
          vl = os.environ.get('VLESS_LINK', '').strip()
          r = ['', 8443, '', '', '', '']
          if vl:
              v = u.urlparse(vl)
              vq = u.parse_qs(v.query)
              r = [v.hostname or '', v.port or 443, u.unquote(v.username or ''),
                   vq.get('pbk', [''])[0], vq.get('sid', [''])[0], vq.get('sni', [''])[0]]
          extra = (
              '    static let realityServer = "%s"\n'
              '    static let realityPort = %d\n'
              '    static let realityUUID = "%s"\n'
              '    static let realityPublicKey = "%s"\n'
              '    static let realityShortID = "%s"\n'
              '    static let realitySNI = "%s"\n'
          ) % tuple(r)
          code = code.rstrip()[:-1] + extra + '}\n'
          open('Extension/Credentials.swift', 'w').write(code)
          print('Reality:', 'on, ' + r[0] if r[2] else 'not set')
          print('Credentials written for', p.hostname)
          PY

      - name: Register WARP
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, datetime
          P = 2**255 - 19
          def x25519(k, u):
              k = bytearray(k); k[0] &= 248; k[31] &= 127; k[31] |= 64
              k = int.from_bytes(k, 'little'); x1 = u
              x2, z2, x3, z3, swap = 1, 0, u, 1, 0
              for t in reversed(range(255)):
                  b = (k >> t) & 1
                  if swap ^ b:
                      x2, x3, z2, z3 = x3, x2, z3, z2
                  swap = b
                  A = (x2 + z2) % P; AA = A * A % P
                  B = (x2 - z2) % P; BB = B * B % P
                  E = (AA - BB) % P
                  C = (x3 + z3) % P; D = (x3 - z3) % P
                  DA = D * A % P; CB = C * B % P
                  x3 = (DA + CB) ** 2 % P
                  z3 = x1 * (DA - CB) ** 2 % P
                  x2 = AA * BB % P
                  z2 = E * (AA + 121665 * E) % P
              if swap:
                  x2, x3, z2, z3 = x3, x2, z3, z2
              return (x2 * pow(z2, P - 2, P) % P).to_bytes(32, 'little')
          out = ''
          try:
              priv = bytearray(os.urandom(32)); priv[0] &= 248; priv[31] &= 127; priv[31] |= 64
              pub = x25519(bytes(priv), 9)
              body = json.dumps({
                  'key': base64.b64encode(pub).decode(), 'install_id': '', 'fcm_token': '',
                  'tos': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%S.000Z'),
                  'model': 'PC', 'serial_number': '', 'locale': 'en_US', 'type': 'Android'
              }).encode()
              req = urllib.request.Request('https://api.cloudflareclient.com/v0a2158/reg', data=body, headers={
                  'Content-Type': 'application/json', 'User-Agent': 'okhttp/3.12.1', 'CF-Client-Version': 'a-6.10-2158'})
              cfg = json.load(urllib.request.urlopen(req, timeout=20))['config']
              cid = base64.b64decode(cfg.get('client_id', '') or 'AAAA')
              adr = cfg['interface']['addresses']
              out = json.dumps({
                  'privateKey': base64.b64encode(bytes(priv)).decode(),
                  'peerKey': cfg['peers'][0]['public_key'],
                  'v4': adr['v4'], 'v6': adr.get('v6', ''),
                  'reserved': list(cid[:3])
              })
              print('WARP registered, address', adr['v4'])
          except Exception as e:
              print('WARP registration failed:', e)
          open('Shared/WarpBaked.swift', 'w').write('enum WarpBaked {\n    static let json = %s\n}\n' % json.dumps(out))
          PY

      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Extra images
        run: |
          mkdir -p Extras
          python3 - <<'EOP'
          import os, json, glob, shutil
          A = 'App/Assets.xcassets'
          for f in glob.glob('Extras/*.png') + glob.glob('Extras/*.jpg'):
              name, ext = os.path.splitext(os.path.basename(f))
              d = f'{A}/{name}.imageset'
              os.makedirs(d, exist_ok=True)
              shutil.copy(f, f'{d}/{name}{ext}')
              json.dump({"images": [{"filename": f"{name}{ext}", "idiom": "universal"}], "info": {"author": "xcode", "version": 1}}, open(f'{d}/Contents.json', 'w'))
              print('asset', name)
          EOP

      - name: Fetch ByeDPI engine
        run: |
          rm -rf /tmp/byedpi
          git clone https://github.com/hufrea/byedpi /tmp/byedpi
          cd /tmp/byedpi
          git checkout e2684772fbda45f2ff4fc220922a010370534216
          mkdir -p "$GITHUB_WORKSPACE/Extension/ByeDPI"
          cp conev.c desync.c extend.c main.c mpool.c packets.c proxy.c *.h "$GITHUB_WORKSPACE/Extension/ByeDPI/"
          ls "$GITHUB_WORKSPACE/Extension/ByeDPI"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Sanhehuey.xcodeproj -scheme Sanhehuey \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 60

      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | head -40 || true

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "Sanhehuey.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          ldid -SApp/App.entitlements Payload/Sanhehuey.app/Sanhehuey || true
          ldid -SExtension/Extension.entitlements Payload/Sanhehuey.app/PlugIns/SanhehueyTunnel.appex/SanhehueyTunnel || true
          zip -qry Sanhehuey-unsigned.ipa Payload
          ls -la Sanhehuey-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Sanhehuey-unsigned-ipa
          path: Sanhehuey-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
