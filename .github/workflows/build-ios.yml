name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SINGBOX_TAG: v1.12.25

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Libbox
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: Frameworks/Libbox.xcframework
          key: libbox-${{ env.SINGBOX_TAG }}-ios-v1

      - name: Build Libbox (sing-box core)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SINGBOX_TAG" https://github.com/SagerNet/sing-box sing-box-src
          cd sing-box-src
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          go run ./cmd/internal/build_libbox -target apple -platform ios
          mkdir -p ../Frameworks
          rm -rf ../Frameworks/Libbox.xcframework
          mv Libbox.xcframework ../Frameworks/

      - name: Inject key from secret
        env:
          HY2_LINK: ${{ secrets.HY2_LINK }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse as u
          link = os.environ.get('HY2_LINK', '').strip()
          if not link:
              sys.exit('Secret HY2_LINK is empty')
          p = u.urlparse(link)
          q = u.parse_qs(p.query)
          code = (
              'enum Credentials {\n'
              '    static let server = "%s"\n'
              '    static let port = %d\n'
              '    static let password = "%s"\n'
              '    static let sni = "%s"\n'
              '    static let obfsPassword = "%s"\n'
              '}\n'
          ) % (p.hostname, p.port or 443, u.unquote(p.username or ''), q.get('peer', [p.hostname])[0], q.get('obfs-password', [''])[0])
          open('Extension/Credentials.swift', 'w').write(code)
          print('Credentials written for', p.hostname)
          PY

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Sanhehuey.xcodeproj -scheme Sanhehuey \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 60

      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | head -40 || true

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "Sanhehuey.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          ldid -SApp/App.entitlements Payload/Sanhehuey.app/Sanhehuey || true
          ldid -SExtension/Extension.entitlements Payload/Sanhehuey.app/PlugIns/SanhehueyTunnel.appex/SanhehueyTunnel || true
          zip -qry Sanhehuey-unsigned.ipa Payload
          ls -la Sanhehuey-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Sanhehuey-unsigned-ipa
          path: Sanhehuey-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
